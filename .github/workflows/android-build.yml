name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Create Dummy Dist
        working-directory: frontend
        run: |
          mkdir -p dist
          echo "<html><body>Mom's Kitchen</body></html>" > dist/index.html

      - name: Capacitor Sync
        working-directory: frontend
        run: npx cap sync android

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p frontend/android/app/keystores
          echo "$KEYSTORE_BASE64" | base64 --decode > frontend/android/app/keystores/messmate-release.jks

      - name: Build Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Use Android SDK build-tools apksigner
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools | sort -n | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner sign \
            --ks frontend/android/app/keystores/messmate-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
          
          # Rename to Moms-Kitchen.apk for better user experience
          mv frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk frontend/android/app/build/outputs/apk/release/Moms-Kitchen.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Moms-Kitchen-App
          path: frontend/android/app/build/outputs/apk/release/Moms-Kitchen.apk
